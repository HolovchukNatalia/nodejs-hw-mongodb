tags:
  - Auth
summary: Refresh user session
operationId: refreshUserSession
description: 'Refresh the session to issue a new access token'
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully refreshed a session!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed a session!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'X+mk7fW8zcVBpr/gMHTxlePqa1oTBrL5u/fw9NqK'
  '401':
    $ref: ../../components/responses/401.yaml
