description: Successfully registered
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: Successfully registered a user
        data:
          type: object
          required:
            - _id
            - name
            - email
            - createdAt
            - updatedAt
          properties:
            _id:
              type: string
              example: 686917c8a27ed4963604d055
              description: User ID
            name:
              type: string
              example: Bob
              description: User's name
            email:
              type: string
              format: email
              example: user.email@gmail.com
              description: User's email
            createdAt:
              type: string
              format: date-time
              example: 2024-05-08T16:12:14.954208
              description: Creation date
            updatedAt:
              type: string
              format: date-time
              example: 2024-05-08T16:12:14.954211
              description: Update date
